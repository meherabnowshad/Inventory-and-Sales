name: CI Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-and-secret-audit:
    name: Code Formatting & Secret Audit (NFR-SEC-03, NFR-MNT-01)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Check Code Formatting (Prettier)
        run: npm run format:check

      - name: Secret Scan Verification
        run: |
          if git ls-files | grep -E "(^|/)\.env$"; then
            echo "ERROR: Tracked .env file detected! NFR-SEC-03 violation."
            exit 1
          fi
          echo "Secret scan passed: No committed .env files found."

  backend-checks:
    name: Backend Lint & Typecheck (NFR-MNT-01, NFR-OPS-01)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate --workspace=backend

      - name: Lint Backend Code
        run: npm run lint --workspace=backend

      - name: Test Backend
        run: npm run test:backend

      - name: Compile Backend TypeScript
        run: npm run build:backend

  frontend-checks:
    name: Frontend Lint & Build (NFR-MNT-01, NFR-OPS-01)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Lint Frontend Code
        run: npm run lint --workspace=frontend

      - name: Test Frontend
        run: npm run test:frontend

      - name: Build Frontend Application
        run: npm run build:frontend

  api-tests:
    name: API Tests against Test Database (NFR-OPS-01)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: smartmart
          POSTGRES_PASSWORD: smartmart_dev
          POSTGRES_DB: inventory_sales_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate --workspace=backend

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgresql://smartmart:smartmart_dev@localhost:5432/inventory_sales_db_test?schema=public
        run: npm run db:migrate --workspace=backend

      - name: Seed Test Database
        env:
          DATABASE_URL: postgresql://smartmart:smartmart_dev@localhost:5432/inventory_sales_db_test?schema=public
        run: npm run db:seed --workspace=backend

      - name: Run API Tests
        env:
          DATABASE_URL: postgresql://smartmart:smartmart_dev@localhost:5432/inventory_sales_db_test?schema=public
          NODE_ENV: test
        run: npm run test:api
