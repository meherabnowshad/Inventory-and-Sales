name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Login smoke test (NFR-OPS-01)
    timeout-minutes: 30
    runs-on: ubuntu-latest

    # Same test database setup as the API Tests job in ci.yml
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: smartmart
          POSTGRES_PASSWORD: smartmart_dev
          POSTGRES_DB: inventory_sales_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smartmart -d inventory_sales_db_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Test-only values for the app started below (no real secrets)
    env:
      DATABASE_URL: postgresql://smartmart:smartmart_dev@localhost:5432/inventory_sales_db_test?schema=public
      JWT_SECRET: test_ci_jwt_secret_key_minimum_32_characters_for_testing
      PORT: 5001
      CORS_ORIGIN: http://localhost:5173

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            e2e/package-lock.json

      - name: Install app dependencies (backend and frontend)
        run: npm ci

      - name: Install Playwright dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browser
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Generate Prisma Client
        run: npm run prisma:generate --workspace=backend

      - name: Run Database Migrations
        run: npm run db:migrate --workspace=backend

      - name: Seed Test Database
        run: npm run db:seed --workspace=backend

      - name: Start backend and frontend
        run: |
          nohup npm run dev:backend > backend.log 2>&1 &
          nohup npm run dev:frontend > frontend.log 2>&1 &

      - name: Wait for the app to be ready
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:5001/api/health > /dev/null && curl -fsS http://localhost:5173/login > /dev/null; then
              echo "App is ready"
              exit 0
            fi
            sleep 2
          done
          echo "App did not start in time"
          exit 1

      - name: Run smoke tests
        working-directory: e2e
        run: npm run test:smoke
        env:
          BASE_URL: ${{ vars.BASE_URL }}

      - name: Show app logs on failure
        if: failure()
        run: |
          echo "--- backend.log ---"
          cat backend.log || true
          echo "--- frontend.log ---"
          cat frontend.log || true

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 30
